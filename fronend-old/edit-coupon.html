<!DOCTYPE html>
<html>

<head>
    <title>Edit Coupon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>Coupon System</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="coupons.html">Available Coupons</a>
            <button onclick="logout()">Logout</button>
        </div>

    </nav>


    <div class="form-container">

        <h1>Edit Coupon</h1>

        <form id="editForm">

            <label>Coupon Code</label>

            <input
                type="text"
                id="editCode"
                required
            >


            <label>Discount (%)</label>

            <input
                type="number"
                id="editDiscount"
                min="1"
                max="100"
                required
            >


            <label>Expiry Date</label>

            <input
                type="date"
                id="editExpiryDate"
                required
            >


            <button type="submit">
                Update Coupon
            </button>

        </form>

        <p id="editMessage"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
