<!DOCTYPE html>
<html>

<head>
    <title>Add Coupon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>Coupon System</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="coupons.html">Available Coupons</a>
            <a href="add-coupon.html">Add Coupon</a>
            <button onclick="logout()">Logout</button>
        </div>

    </nav>


    <div class="form-container">

        <h1>Add New Coupon</h1>

        <form id="couponForm">

            <label>Coupon Code</label>

            <input
                type="text"
                id="code"
                placeholder="Example: SAVE20"
                required
            >


            <label>Discount (%)</label>

            <input
                type="number"
                id="discount"
                placeholder="Example: 20"
                min="1"
                max="100"
                required
            >


            <label>Expiry Date</label>

            <input
                type="date"
                id="expiryDate"
                required
            >


            <button type="submit">
                Add Coupon
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
