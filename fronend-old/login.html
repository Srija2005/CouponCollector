<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>Coupon System</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="coupons.html">Available Coupons</a>
        </div>

    </nav>


    <div class="form-container">

        <h1>Admin Login</h1>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
